<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator — B25DCTV016</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="container">
        <div class="calculator">
            <!-- Top bar -->
            <div class="topbar">
                <div class="window-dots">
                    <span class="wdot wdot-red"></span>
                    <span class="wdot wdot-yellow"></span>
                    <span class="wdot wdot-green"></span>
                </div>
                <span class="topbar-title">Calculator</span>
                <div class="topbar-spacer"></div>
            </div>

            <!-- Display -->
            <div class="display-area">
                <div id="expression" class="expression"></div>
                <div id="display" class="display">0</div>
            </div>

            <!-- Buttons -->
            <div class="btn-grid">
                <button class="btn fn" id="btnClear">AC</button>
                <button class="btn fn" data-value="(">(</button>
                <button class="btn fn" data-value=")">)</button>
                <button class="btn op" data-value="/">÷</button>

                <button class="btn num" data-value="7">7</button>
                <button class="btn num" data-value="8">8</button>
                <button class="btn num" data-value="9">9</button>
                <button class="btn op" data-value="*">×</button>

                <button class="btn num" data-value="4">4</button>
                <button class="btn num" data-value="5">5</button>
                <button class="btn num" data-value="6">6</button>
                <button class="btn op" data-value="-">−</button>

                <button class="btn num" data-value="1">1</button>
                <button class="btn num" data-value="2">2</button>
                <button class="btn num" data-value="3">3</button>
                <button class="btn op" data-value="+">+</button>

                <button class="btn num wide" data-value="0">0</button>
                <button class="btn num" data-value=".">.</button>
                <button class="btn eq" id="btnEqual">=</button>
            </div>
        </div>

        <p class="credit">B25DCTV016 — PTIT &copy; 2026</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
